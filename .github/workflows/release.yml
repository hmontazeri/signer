name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build app
        run: ./build.sh

      - name: Zip app
        run: |
          VERSION="${GITHUB_REF_NAME}"
          [[ "$GITHUB_REF" == refs/tags/* ]] || VERSION="dev-${GITHUB_SHA::7}"
          ditto -c -k --sequesterRsrc --keepParent build/Signer.app "PDF-Signer-${VERSION}.zip"
          echo "ZIP=PDF-Signer-${VERSION}.zip" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: PDF-Signer
          path: ${{ env.ZIP }}

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$ZIP" \
            --title "PDF Signer $GITHUB_REF_NAME" \
            --notes "Download \`$ZIP\`, entpacken, nach /Programme ziehen. Beim ersten Start Rechtsklick → Öffnen (App ist nicht notarisiert)."
